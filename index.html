<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日课">
  <title>日课</title>

  <!-- 图标与 Manifest -->
  <link rel="icon" type="image/png" sizes="192x192" href="web-app-rike-512x512.png">
  <link rel="icon" type="image/png" sizes="512x512" href="web-app-rike-512x512.png">
  <link rel="apple-touch-icon" href="web-app-rike-512x512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fafafa;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycby69YsCquWtspBOUNvmMAjYLPntKN6GvMUp9OxOGC_mLqPj9PJAvV1oFJ-G7vI0PDVqGA/exec" allow="fullscreen"></iframe>
</body>
</html>
